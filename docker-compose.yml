services:
  postgres:
    image: postgres:16-alpine
    container_name: ecomerce-futbol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecomerce_futbol
      POSTGRES_USER: ecomerce_futbol
      POSTGRES_PASSWORD: ecomerce_futbol_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomerce_futbol -d ecomerce_futbol"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
