schema: spec-driven
project: ecomerce-futbol
detected: 2026-06-13
persistence_mode: hybrid
strict_tdd: false

context: |
  Stack: Next.js 16.2.9 App Router, React 19.2.4, TypeScript strict, Tailwind CSS v4 via PostCSS.
  Package manager: pnpm 11.6.0 with pnpm-lock.yaml and packageManager metadata.
  Architecture: UI-first storefront, mock-data-before-database, future feature-oriented catalog/cart/checkout structure.
  Source: src/app, src/components, src/lib with @/* path alias to ./src/*.
  UI: shadcn/Radix-style component setup is present via components.json and dependencies; lucide-react icons.
  Deferred: Prisma, auth, payments, database migrations, and real checkout/order persistence.
  Catalog planning: Product, Category, Brand, ProductImage, products API, Catalog UI, and Product Detail UI remain future work.

