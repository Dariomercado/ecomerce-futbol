rules:
  proposal:
    - Keep backend and persistence choices deferred until UI and catalog rules are validated.
    - Surface documentation conflicts before treating older guardrails as authoritative.
  specs:
    - Use RFC 2119 keywords and Given/When/Then scenarios.
    - Model catalog entities at the product-behavior level before database schemas.
  design:
    - Preserve the UI-first and mock-first architecture unless explicitly changed.
    - Document tradeoffs before adding Prisma, API routes, auth, payments, or persistence.
  tasks:
    - Keep UI, data-shape, and infrastructure tasks separated for reviewability.
    - Forecast review workload before apply.
  apply:
    tdd: false
    test_command: ""
    constraints:
      - Do not install dependencies unless the user explicitly approves.
      - Do not create Prisma, API routes, or new catalog pages during initialization.
  verify:
    test_command: ""
    build_command: "pnpm build"
    lint_command: "pnpm lint"
    coverage_threshold: 0
  archive:
    - Preserve archived changes as audit history.

